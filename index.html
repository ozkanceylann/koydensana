<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Köydensana.com | Yapım Aşamasında</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1b5e20, #66bb6a);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      padding: 18px;
      box-sizing: border-box;
    }

    .container {
      width: 100%;
      max-width: 680px;
      padding: 22px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(1px);
    }

    h1 {
      font-size: clamp(32px, 6vw, 42px);
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
      opacity: 0.95;
      margin: 14px 0;
    }

    .badge {
      display: inline-block;
      padding: 8px 14px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 20px;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .hero-visual {
      margin: 18px 0 6px;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
      background: rgba(255, 255, 255, 0.1);
    }

    .hero-visual svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .contact {
      margin-top: 25px;
      padding: 12px 18px;
      background: #ffffff;
      color: #1b5e20;
      display: inline-block;
      border-radius: 8px;
      font-weight: bold;
      text-decoration: none;
    }

    .contact:hover {
      background: #f1f1f1;
    }

    footer {
      margin-top: 30px;
      font-size: 13px;
      opacity: 0.8;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="badge">🚧 Yapım Aşamasında</div>

    <h1>Köydensana.com</h1>

    <div class="hero-visual" aria-label="Köy ürünleri görseli">
      <svg viewBox="0 0 960 360" role="img" aria-labelledby="heroTitle heroDesc" xmlns="http://www.w3.org/2000/svg">
        <title id="heroTitle">Köydensana köy ürünleri</title>
        <desc id="heroDesc">Orta kısımda ahşap masa, kenarlarda kuru domates, salça, zeytin ve ceviz illüstrasyonu.</desc>
        <defs>
          <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#c8e6c9"/>
            <stop offset="100%" stop-color="#81c784"/>
          </linearGradient>
          <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#9c6b3c"/>
            <stop offset="100%" stop-color="#6d4726"/>
          </linearGradient>
        </defs>

        <rect x="0" y="0" width="960" height="360" fill="url(#bg)"/>
        <ellipse cx="480" cy="285" rx="360" ry="54" fill="rgba(0,0,0,0.16)"/>
        <rect x="210" y="210" width="540" height="88" rx="14" fill="url(#wood)"/>

        <g transform="translate(120 120)">
          <ellipse cx="80" cy="160" rx="82" ry="26" fill="rgba(0,0,0,.2)"/>
          <ellipse cx="80" cy="132" rx="78" ry="24" fill="#ff7043"/>
          <circle cx="48" cy="124" r="12" fill="#d84315"/>
          <circle cx="80" cy="128" r="10" fill="#d84315"/>
          <circle cx="110" cy="122" r="12" fill="#d84315"/>
          <circle cx="62" cy="142" r="9" fill="#d84315"/>
          <circle cx="94" cy="140" r="10" fill="#d84315"/>
          <text x="80" y="197" text-anchor="middle" font-size="18" fill="#fff" font-weight="700">Kuru Domates</text>
        </g>

        <g transform="translate(290 96)">
          <ellipse cx="106" cy="184" rx="94" ry="24" fill="rgba(0,0,0,.2)"/>
          <rect x="44" y="50" width="124" height="132" rx="20" fill="#f5f5f5"/>
          <rect x="56" y="66" width="100" height="100" rx="14" fill="#c62828"/>
          <rect x="56" y="40" width="100" height="24" rx="8" fill="#e0e0e0"/>
          <text x="106" y="210" text-anchor="middle" font-size="18" fill="#fff" font-weight="700">Salça</text>
        </g>

        <g transform="translate(510 110)">
          <ellipse cx="86" cy="170" rx="84" ry="22" fill="rgba(0,0,0,.2)"/>
          <ellipse cx="86" cy="138" rx="80" ry="26" fill="#37474f"/>
          <ellipse cx="60" cy="134" rx="12" ry="10" fill="#263238"/>
          <ellipse cx="90" cy="140" rx="10" ry="8" fill="#263238"/>
          <ellipse cx="114" cy="132" rx="11" ry="9" fill="#263238"/>
          <text x="86" y="198" text-anchor="middle" font-size="18" fill="#fff" font-weight="700">Zeytin</text>
        </g>

        <g transform="translate(700 108)">
          <ellipse cx="76" cy="172" rx="78" ry="22" fill="rgba(0,0,0,.2)"/>
          <circle cx="52" cy="128" r="20" fill="#8d6e63"/>
          <circle cx="86" cy="138" r="21" fill="#a1887f"/>
          <circle cx="112" cy="122" r="19" fill="#8d6e63"/>
          <circle cx="76" cy="114" r="18" fill="#6d4c41"/>
          <text x="76" y="200" text-anchor="middle" font-size="18" fill="#fff" font-weight="700">Ceviz</text>
        </g>
      </svg>
    </div>

    <p>
      Doğal köy ürünleri çok yakında sizlerle!<br>
      En taze zeytin, zeytinyağı, salça ve daha fazlası için hazırlıklarımız devam ediyor.
    </p>

    <p>
      🏡 Köyden sofranıza gelen doğal lezzetler yakında burada olacak.
    </p>

    <a class="contact" href="mailto:info@koydensana.com">
      Bize Ulaş
    </a>

    <footer>
      © 2026 Köydensana.com - Tüm hakları saklıdır.
    </footer>
  </div>
</body>
</html>
