<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Köyden Sana</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f8f5ef;
        --primary: #4f6f3b;
        --text: #2f2f2f;
        --card: #ffffff;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Segoe UI", Roboto, sans-serif;
        color: var(--text);
        background: linear-gradient(180deg, #f8f5ef 0%, #f2ecdf 100%);
      }

      .hero {
        min-height: 48vh;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 4rem 1rem 2rem;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 6vw, 4rem);
        color: var(--primary);
      }

      .subtitle {
        margin-top: 1rem;
        font-size: clamp(1rem, 2vw, 1.2rem);
      }

      .products {
        width: min(1100px, 92%);
        margin: 0 auto 4rem;
      }

      .products h2 {
        text-align: center;
        color: var(--primary);
        margin-bottom: 1.5rem;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 1rem;
      }

      .card {
        background: var(--card);
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 6px 24px rgba(0,0,0,0.08);
      }

      .card img {
        width: 100%;
        height: 180px;
        object-fit: cover;
        display: block;
      }

      .card p {
        margin: 0;
        padding: 0.85rem 1rem 1rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero">
        <div>
          <h1>Köyden Sana</h1>
          <p class="subtitle">Şu anda yapım aşamasındayız.</p>
        </div>
      </section>

      <section class="products">
        <h2>Doğal Köy Ürünleri</h2>
        <div class="grid">
          <article class="card">
            <img src="https://images.unsplash.com/photo-1604908176997-431945e2eaf0?auto=format&fit=crop&w=900&q=80" alt="Kuru domates" />
            <p>Kuru Domates</p>
          </article>
          <article class="card">
            <img src="https://images.unsplash.com/photo-1614064641938-3bbee52942c7?auto=format&fit=crop&w=900&q=80" alt="Siyah zeytin" />
            <p>Siyah Zeytin</p>
          </article>
          <article class="card">
            <img src="https://images.unsplash.com/photo-1470158499416-75be9aa0c4db?auto=format&fit=crop&w=900&q=80" alt="Bağ üzümü" />
            <p>Bağ Üzümü</p>
          </article>
          <article class="card">
            <img src="https://images.unsplash.com/photo-1591511754760-82026f7f8f13?auto=format&fit=crop&w=900&q=80" alt="Bağ yaprakları" />
            <p>Bağ Yaprakları</p>
          </article>
          <article class="card">
            <img src="https://images.unsplash.com/photo-1615485500704-8e990f9900f7?auto=format&fit=crop&w=900&q=80" alt="Ceviz" />
            <p>Ceviz</p>
          </article>
          <article class="card">
            <img src="https://images.unsplash.com/photo-1628771065518-0d82f1938462?auto=format&fit=crop&w=900&q=80" alt="Yeşil zeytin" />
            <p>Yeşil Zeytin</p>
          </article>
          <article class="card">
            <img src="https://images.unsplash.com/photo-1608135390439-9f5f595f6f9d?auto=format&fit=crop&w=900&q=80" alt="Ev yapımı salça" />
            <p>Salça</p>
          </article>
        </div>
      </section>
    </main>
  </body>
</html>
